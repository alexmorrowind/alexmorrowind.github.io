---
deployment:
  tasks:
    - export APP_ROOT=$HOME/b1pay_backend
    - export PUBLIC_ROOT=$HOME/public_html
    - export PYTHON_BIN=$HOME/virtualenv/b1pay_backend/3.13/bin/python
    - mkdir -p $APP_ROOT
    - mkdir -p $PUBLIC_ROOT
    - rsync -a --delete --exclude='.DS_Store' --exclude='.htaccess' --exclude='.user.ini' --exclude='php.ini' --exclude='.well-known' fintech_new/front/ $PUBLIC_ROOT/
    - rsync -a --delete --exclude='.env' --exclude='.env.*' --exclude='db.sqlite3' --exclude='public' --exclude='staticfiles' --exclude='tmp' --exclude='__pycache__' --exclude='*.pyc' --exclude='.DS_Store' fintech_new/my_payment_project/ $APP_ROOT/
    - cd $APP_ROOT && $PYTHON_BIN -m pip install -r requirements.txt
    - cd $APP_ROOT && $PYTHON_BIN manage.py collectstatic --no-input
    - cd $APP_ROOT && $PYTHON_BIN manage.py migrate --noinput
    - cd $APP_ROOT && $PYTHON_BIN manage.py ensure_superuser
    - mkdir -p $APP_ROOT/tmp && touch $APP_ROOT/tmp/restart.txt
    - find $PUBLIC_ROOT -name '._*' -type f -delete
    - find $PUBLIC_ROOT -type d -exec chmod 755 {} +
    - find $PUBLIC_ROOT -type f -exec chmod 644 {} +
    - chmod 755 $PUBLIC_ROOT || true
