<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup — B1</title>
  <link rel="icon" href="favicon.ico?v=20260825" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png?v=20260825">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260825">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    .startup-detail-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 118px 48px 90px;
    }

    .startup-back {
      display: inline-flex;
      margin-bottom: 20px;
      color: var(--blue-neon);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .startup-detail-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
      gap: 26px;
      align-items: stretch;
      margin-bottom: 18px;
      padding: clamp(26px, 5vw, 52px);
      border: 1px solid rgba(59, 130, 246, 0.14);
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 16px 42px rgba(15, 23, 42, 0.06);
    }

    .startup-detail-hero h1 {
      margin-bottom: 8px;
      font-family: var(--font-display);
      font-size: clamp(38px, 6vw, 66px);
      letter-spacing: -0.035em;
      line-height: 1.02;
    }

    .startup-detail-hero p {
      max-width: 720px;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.7;
    }

    .startup-round {
      align-self: stretch;
      padding: 22px;
      border-radius: 16px;
      background: var(--grad-soft);
    }

    .startup-round > strong {
      display: block;
      margin-bottom: 28px;
      color: var(--blue-neon);
      font-family: var(--font-display);
      font-size: 30px;
      line-height: 1.1;
    }

    .startup-round small {
      display: block;
      margin-top: 10px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .startup-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .startup-stage,
    .startup-domain {
      padding: 6px 8px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .startup-stage {
      background: rgba(124, 58, 237, 0.1);
      color: #7c3aed;
    }

    .startup-domain {
      background: rgba(37, 99, 235, 0.08);
      color: var(--blue-neon);
    }

    .startup-company {
      margin-bottom: 16px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .startup-progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .startup-progress-meta strong {
      color: var(--text-primary);
      font-size: 13px;
    }

    .startup-progress {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9eef8;
    }

    .startup-progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--grad-primary);
    }

    .startup-facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 20px 0;
    }

    .startup-facts div {
      min-width: 0;
      padding: 10px;
      border-radius: 10px;
      background: #f8fbff;
    }

    .startup-facts span {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .startup-facts strong {
      display: block;
      overflow: hidden;
      color: var(--text-primary);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .startup-detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.8fr);
      gap: 18px;
    }

    .startup-panel {
      padding: 28px;
      border: 1px solid rgba(59, 130, 246, 0.12);
      border-radius: 16px;
      background: #fff;
    }

    .startup-panel h2 {
      margin-bottom: 12px;
      font-family: var(--font-display);
      font-size: 27px;
    }

    .startup-panel p {
      color: var(--text-secondary);
      line-height: 1.75;
      white-space: pre-line;
    }

    .startup-disclosure {
      margin-top: 24px;
      padding: 14px;
      border-left: 3px solid #f59e0b;
      background: #fffbeb;
      color: #92400e;
      font-size: 13px;
      line-height: 1.55;
    }

    .startup-detail-facts {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin: 18px 0;
    }

    .startup-invest-form {
      display: grid;
      gap: 10px;
    }

    .startup-invest-form label {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
    }

    .startup-invest-form input {
      min-height: 46px;
      padding: 0 12px;
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 9px;
      font: inherit;
      outline: none;
    }

    .startup-invest-form input:focus {
      border-color: var(--blue-neon);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .startup-invest-form .btn-hero {
      justify-content: center;
      margin-top: 4px;
    }

    .startup-invest-status {
      min-height: 22px;
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.45;
    }

    .startup-state {
      padding: 36px;
      border: 1.5px dashed rgba(59, 130, 246, 0.2);
      border-radius: 14px;
      color: var(--text-secondary);
      text-align: center;
    }

    @media (max-width: 900px) {
      .startup-detail-page {
        padding-inline: 24px;
      }

      .startup-detail-hero,
      .startup-detail-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .startup-detail-page {
        padding: 96px 20px 60px;
      }

      .startup-panel {
        padding: 20px;
      }

      .startup-facts {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
